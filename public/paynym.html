<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="container">
    <div class="nav-bar">
      <a href="/" class="back-link">← Back to Home</a>
      <span style="color: var(--text-muted); font-size: 0.8rem;">[PAYNYM EXPLORER]</span>
    </div>
    
    <main class="main-content" id="main">
      <div class="header">
          <h1>> PAYNYM EXPLORER</h1>
          <div class="subtitle">Search and explore PayNym identities</div>
          <br/>
        </div>
        
        <div class="search-section">
          <label class="search-label">Enter Payment Code, NymID, or NymName:</label>
          <div class="search-container">
            <input 
              type="text" 
              class="search-input" 
              id="searchInput"
              placeholder="PM8T... or nymName or nymID"
              data-enter-action="search"
            >
            <button class="search-btn" id="searchBtn" data-action="search">
              SEARCH
            </button>
          </div>
        </div>
        
        <div id="resultsContainer" class="results-section">
          <!-- Results will be populated here -->
        </div>
        
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">🔍</div>
          <p>Enter a payment code, nymID, or nymName to explore</p>
        </div>
      </main>
    </div>
    
    <div class="footer">
      <div class="footer-text">Built with <span class="footer-heart">♥</span> for the cypherpunk community</div>
      <div class="footer-text">Privacy is a human fight</div>
    </div>

  <script src="/js/common.js"></script>
  <script src="/js/paynym.js"></script>
